# nginx reverse proxy for bot.cryptovoip.in → Docker bot-server on 127.0.0.1:8000
# Place at: /etc/nginx/sites-available/bot.cryptovoip.in
# Enable:   sudo ln -s /etc/nginx/sites-available/bot.cryptovoip.in \
#                      /etc/nginx/sites-enabled/bot.cryptovoip.in
# SSL certs are managed by certbot (see DEPLOY.md).

server {
    listen 80;
    server_name bot.cryptovoip.in;
    # certbot will replace this block with a redirect once certs are issued
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.cryptovoip.in;

    # certbot populates these paths automatically
    ssl_certificate     /etc/letsencrypt/live/bot.cryptovoip.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.cryptovoip.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep connections alive for long-running bot sessions
        proxy_read_timeout 120s;
    }
}

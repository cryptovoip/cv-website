# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name bot.cryptovoip.in;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name bot.cryptovoip.in;

    # SSL certificates (certbot will add these)
    ssl_certificate /etc/letsencrypt/live/bot.cryptovoip.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.cryptovoip.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_connect_timeout 120;
        proxy_send_timeout    120;
        proxy_read_timeout    120;

        proxy_buffering off;
    }
}

# Production stack: bot-server only.
# nginx on the host acts as the reverse proxy + TLS terminator.
# bot-server binds to 127.0.0.1:8000 so it is NOT reachable directly from the internet.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires:
#   - A populated .env file (copy from .env.example)
#   - nginx + certbot configured on the host (see DEPLOY.md)

services:
  bot-server:
    build: .
    container_name: cryptovoip-bot
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

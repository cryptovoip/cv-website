# nginx reverse proxy for bot.cryptovoips.com → Docker bot-server on 127.0.0.1:8000
# Place at: /etc/nginx/sites-available/bot.cryptovoips.com
# Enable:   sudo ln -s /etc/nginx/sites-available/bot.cryptovoips.com \
#                      /etc/nginx/sites-enabled/bot.cryptovoips.com
# SSL certs are managed by certbot (see DEPLOY.md).

server {
    listen 80;
    server_name bot.cryptovoips.com;
    # certbot will replace this block with a redirect once certs are issued
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bot.cryptovoips.com;

    # certbot populates these paths automatically
    ssl_certificate     /etc/letsencrypt/live/bot.cryptovoips.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.cryptovoips.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep connections alive for long-running bot sessions
        proxy_read_timeout 120s;
    }
}
